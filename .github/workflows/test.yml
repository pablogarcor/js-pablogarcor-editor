name: test

on:
  push:
    branches: [main]
  pull_request:
  # Every Monday: catches new blog posts that the parser cannot round-trip.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pablogarcor/js-pablogarcor-web
          path: blog
      - run: node --version
      - run: node --test
        env:
          BLOG_DIR: blog
      # Type check of the JSDoc in src/ (jsconfig.json). The code stays plain
      # JavaScript: tsc only reads it. Fetched by npx, so the repo still has no
      # package.json.
      - run: npx --yes --package typescript@5.9.3 tsc -p jsconfig.json

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor · pablogarcor.com</title>
  <link rel="stylesheet" href="src/editor/editor.css">
  <script type="module" src="src/editor/app.js"></script>
</head>
<body>
  <header class="bar">
    <span class="brand">Editor</span>
    <button id="new" class="button" type="button">Nuevo post</button>
    <label class="button">
      Abrir post…
      <input id="open" class="visually-hidden" type="file" accept=".md,.markdown,image/*" multiple>
    </label>
    <p id="status" role="status"></p>
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Formato" hidden>
      <select id="block-type" aria-label="Tipo de bloque">
        <option value="paragraph">Párrafo</option>
        <option value="h2">Título 2</option>
        <option value="h3">Título 3</option>
        <option value="h4">Título 4</option>
        <option value="quote">Cita</option>
        <option value="ul">Lista</option>
        <option value="ol">Lista numerada</option>
        <option value="" disabled>—</option>
      </select>
      <span class="group">
        <button type="button" class="tool" data-mark="strong" aria-pressed="false" title="Negrita (Ctrl+B)"><strong>N</strong></button>
        <button type="button" class="tool" data-mark="em" aria-pressed="false" title="Cursiva (Ctrl+I)"><em>K</em></button>
        <button type="button" class="tool" data-mark="code" aria-pressed="false" title="Código (Ctrl+E)"><code>&lt;/&gt;</code></button>
        <button type="button" class="tool" id="link-button" aria-pressed="false" title="Enlace (Ctrl+K)">Enlace</button>
      </span>
      <span class="group">
        <button type="button" class="tool" data-insert="hr" title="Insertar un separador después de este bloque">Separador</button>
        <button type="button" class="tool" data-insert="code" title="Insertar un bloque de código después de este bloque">Bloque de código</button>
      </span>
      <span class="group">
        <button type="button" class="tool" id="undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
        <button type="button" class="tool" id="redo" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer">↷</button>
      </span>
    </div>
    <div id="link-panel" class="link-panel" hidden>
      <label for="link-url">Enlace</label>
      <input id="link-url" type="text" inputmode="url" placeholder="https://… o /ruta-del-blog/" spellcheck="false" autocomplete="off">
      <button type="button" class="button" id="link-apply">Aplicar</button>
      <button type="button" class="button" id="link-remove">Quitar enlace</button>
      <button type="button" class="button" id="link-cancel">Cancelar</button>
      <span id="link-error" class="error" role="alert"></span>
    </div>
  </header>
  <main id="post">
    <div id="empty" class="empty">
      <p>Empieza un post nuevo o abre uno de tu copia local del blog, por ejemplo <code>content/es/blog/2026/07/31/index.md</code>.</p>
      <p>Si el post tiene imágenes, selecciónalas junto al <code>.md</code> en el mismo diálogo para verlas.</p>
      <p>Todavía no se guarda nada: el panel <strong>Markdown</strong> muestra lo que se escribiría.</p>
    </div>
    <section id="meta-form" class="meta-form" aria-label="Datos del post" hidden>
      <input id="meta-title" class="title-input" data-field="title" placeholder="Título del post" aria-label="Título" autocomplete="off">
      <div class="meta-grid">
        <label id="meta-lang-label">Idioma
          <select id="meta-lang">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </label>
        <label>Fecha <input id="meta-date" data-field="date" type="date"></label>
        <label>Slug <input id="meta-slug" data-field="slug" spellcheck="false" autocomplete="off"></label>
        <label>translationKey <input id="meta-key" data-field="translationKey" spellcheck="false" autocomplete="off"></label>
        <label class="wide">Etiquetas <input id="meta-tags" data-field="tags" placeholder="Separadas por comas: Tecnología, Vida Personal" autocomplete="off"></label>
        <label class="wide">Descripción
          <textarea id="meta-description" data-field="description" rows="2" placeholder="Una o dos frases para buscadores y redes sociales"></textarea>
          <span id="meta-count" class="hint"></span>
        </label>
      </div>
      <p id="meta-note" class="hint"></p>
      <ul id="meta-report" class="report" aria-live="polite"></ul>
    </section>
    <div id="editor" class="post" aria-label="Contenido del post" hidden></div>
    <details id="source-panel" class="source" hidden>
      <summary>Markdown</summary>
      <pre id="source"></pre>
    </details>
  </main>
</body>
</html>
